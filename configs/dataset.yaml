# Dataset & Preprocessing Configuration
# =======================================

# Paths to raw RICE datasets (relative to project root)
raw_data:
  rice1_dir: "dataset/RICE1"
  rice2_dir: "dataset/RICE2"

# Preprocessing settings
preprocess:
  input_size: 512          # Original image size
  patch_size: 256          # Tile size for non-overlapping patches
  output_dir: "data/processed"
  splits_dir: "data/splits"

# Train/Val/Test split ratios (image-ID level, not patch level)
split:
  train: 0.80
  val: 0.10
  test: 0.10
  seed: 42                 # Fixed seed for reproducibility

# Normalization contract (symmetric with Tanh output)
normalization:
  min_val: -1.0
  max_val: 1.0
