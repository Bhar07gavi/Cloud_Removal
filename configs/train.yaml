# Training & MLOps Configuration
# ================================

# Training hyperparameters
training:
  batch_size: 16
  epochs: 50
  lr: 0.0002
  beta1: 0.5
  beta2: 0.999
  lambda_l1: 100           # Weight for L1 reconstruction loss
  num_workers: 2

# Model settings
model:
  input_channels: 3
  output_channels: 3

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_every: 5            # Save checkpoint every N epochs
  log_images_every: 5      # Log sample validation grids every N epochs

# MLflow (DagsHub-hosted) — configure later
mlflow:
  tracking_uri: ""         # Will be set via dagshub.init()
  experiment_name: "cloud-removal-gan"
  dagshub_repo_owner: ""   # Fill in when configuring DagsHub
  dagshub_repo_name: ""    # Fill in when configuring DagsHub

# Data paths (should match dataset.yaml output)
data:
  processed_dir: "data/processed"
  splits_dir: "data/splits"
